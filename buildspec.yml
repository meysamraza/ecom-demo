version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
      python: 3.12
    commands:
      - python3 -m venv /opt/sg
      - /opt/sg/bin/pip install --no-cache-dir semgrep
      - curl -sfL https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.67.2_Linux-64bit.tar.gz | tar -xz -C /tmp
      - install -m 0755 /tmp/trivy /usr/local/bin/trivy
      - curl -sfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
      - install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
  pre_build:
    commands:
      - gitleaks detect --source . --no-git --redact --exit-code 1
      - /opt/sg/bin/semgrep --config auto --error --exclude node_modules .
      - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --skip-dirs node_modules .
  build:
    commands:
      - npm ci --omit=dev

artifacts:
  files:
    - '**/*'
  exclude-paths:
    - .git/**/*
