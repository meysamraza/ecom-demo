<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ecom-demo products</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0 auto; max-width: 60rem; padding: 2rem; color: #17202a; }
      h1 { margin-top: 0; }
      .products { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
      article { border: 1px solid #d5d8dc; border-radius: .5rem; padding: 1rem; }
      .price { font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Featured products</h1>
      <section class="products" aria-label="Product list">
        <article><h2>Everyday Backpack</h2><p>Bags</p><p class="price">$49.99</p></article>
        <article><h2>Ceramic Travel Mug</h2><p>Kitchen</p><p class="price">$18.50</p></article>
        <article><h2>Desk Lamp</h2><p>Home</p><p class="price">$32.00</p></article>
        <article><h2>Wireless Headphones</h2><p>Electronics</p><p class="price">$79.95</p></article>
        <article><h2>Cotton T-Shirt</h2><p>Clothing</p><p class="price">$24.00</p></article>
        <article><h2>Notebook Set</h2><p>Stationery</p><p class="price">$12.75</p></article>
      </section>
    </main>
  </body>
</html>
