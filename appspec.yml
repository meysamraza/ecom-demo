version: 0.0
os: linux
files:
  - source: /
    destination: /home/ec2-user/E-com-site
    file_exists_behavior: OVERWRITE
hooks:
  BeforeInstall:
    - location: deploy/stop.sh
      runas: ec2-user
  AfterInstall:
    - location: deploy/install.sh
      runas: ec2-user
  ApplicationStart:
    - location: deploy/start.sh
      runas: ec2-user
  ValidateService:
    - location: deploy/validate.sh
      runas: ec2-user
